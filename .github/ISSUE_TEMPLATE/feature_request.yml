name: Feature request
description: Suggest an idea for the plugin, or another coding agent to support
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: agent
    attributes:
      label: For a new agent (Codex, opencode, ...)
      description: How does it run (process name, command line), and where does it keep its session logs?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
